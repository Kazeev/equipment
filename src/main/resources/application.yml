spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  datasource:
    url: jdbc:h2:file:./data/workflow;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  sql:
    init:
      mode: always
camunda:
  bpm:
    database:
      schema-update: true
    history-level: audit
    job-execution:
      enabled: true
app:
  input-directory: ${INPUT_DIRECTORY:src/main/resources/input}
  poll-delay: 3000
